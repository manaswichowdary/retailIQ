services:
  mysql:
    image: mysql:8.0
    container_name: retailiq-mysql
    environment:
      MYSQL_DATABASE: retailiq
      MYSQL_USER: retailiq
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: